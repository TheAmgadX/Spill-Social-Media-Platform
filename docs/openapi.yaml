                    assets: []
                    likeCount: 12
                    commentCount: 3
                    shareCount: 1
                    liked: false
                    createdAt: "2026-11-26T15:49:26Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid post UUID, invalid JWT role, or invalid post body.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIDResponse"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                emptyBody:
                  summary: ValidationError - Empty post body
                  value:
                    type: "https://api.spill.social/problems/validation-error"
                    title: "Unprocessable Entity"
                    status: 422
                    detail: "validation error: post body cannot be empty"
                    requestId: "req_1a2b3c4d5e6f7a8b9c0d1e2f"
                invalidUuid:
                  summary: ValidationError - Malformed post ID
                  value:
                    type: "https://api.spill.social/problems/validation-error"
                    title: "Unprocessable Entity"
                    status: 422
                    detail: "validation error: postID must be a valid non-nil UUID"
                    requestId: "req_1a2b3c4d5e6f7a8b9c0d1e2f"
        "500":
