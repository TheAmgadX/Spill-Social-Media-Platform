        qa:
          - "Check RBAC: verify `role='admin'` can edit another user's post while `role='user'` receives `403`."

    delete:
      operationId: deletePost
      summary: Soft-delete a post
      description: |
        Sets `deleted_at = now()` on the post.
        Authorization: Only the post author OR an `admin` role user may delete (`403` otherwise).

        **Team Notes Summary:**
        - **Front-End:** Optimistically remove post from feed/profile caches on `204`.
        - **QA:** Subsequent `GET /posts/{id}`, `PATCH /posts/{id}`, `DELETE /posts/{id}`, likes, comments, and shares on this post must all return `404`.
      tags: [Posts]
      security:
        - BearerAuth: []
