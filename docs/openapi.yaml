    patch:
      operationId: updatePost
      summary: Edit a post's text body
      description: |
        Updates the `body` of a non-deleted post and sets `edited_at = now()` in the database (not exposed in `PostResponse`).
        Authorization: Only the post author OR an `admin` role user may edit (`403` otherwise).

        **Team Notes Summary:**
        - **Front-End:** Attachments cannot be modified via `PATCH /posts/{id}`; `body` must be non-whitespace (1–2000 runes) even if the post has attached images.
        - **QA:** Test author edit (`200`), admin edit (`200`), other user edit (`403`), soft-deleted post (`404`), and empty body on image post (`422`).
      tags: [Posts]
      security:
        - BearerAuth: []
      parameters:
