name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit tests
        run: go test $$(go list ./... | grep -v '/tests/e2e') -race -v

      - name: Build binary
        run: mkdir -p bin && go build -o bin/spill-api ./cmd/main.go